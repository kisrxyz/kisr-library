<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1412" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kisr Library" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Личная библиотека книг от Claude: читать офлайн с того места, где остановился." />
    <title>Kisr Library</title>
    <!-- Тема до первой отрисовки: настройки приходят из IndexedDB позже, и тёмная тема успела бы мигнуть светлой.
         Значение зеркалит src/state/settings.ts (ключ kisr-theme); «авто» и сбой хранилища — тема по системе. -->
    <script>
      try {
        var theme = localStorage.getItem('kisr-theme');
        if (theme === 'light' || theme === 'dark' || theme === 'sepia') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
